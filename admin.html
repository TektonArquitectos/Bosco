<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6F3EC">
<title>Panel · Bosco Coffee House</title>
<link rel="icon" href="art/icon-badge.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- ───────── login ───────── -->
<div class="login" id="login" hidden>
  <form class="login-card" id="login-form">
    <div class="login-brand" id="login-brand"></div>
    <h1>Panel del menú</h1>
    <p class="muted">Escribe la contraseña para editar el menú de Bosco.</p>
    <label class="field"><span>Contraseña</span>
      <span class="pw"><input id="pw" type="password" autocomplete="current-password" required autofocus><button type="button" class="pw-eye" id="pw-eye" aria-label="Mostrar contraseña">👁</button></span>
    </label>
    <p class="err" id="login-err" hidden>Contraseña incorrecta. Inténtalo de nuevo.</p>
    <button class="btn btn--fill btn--big" id="login-btn" type="submit">Entrar</button>
    <p class="muted small"><a href="./" id="back-link">← Volver al menú</a></p>
  </form>
</div>

<!-- ───────── the panel ───────── -->
<div class="app" id="app" hidden>
  <header class="top">
    <div class="top-brand"><span class="top-logo" id="top-logo"></span><span class="top-title">Panel del menú</span></div>
    <div class="top-status" id="top-status"><span class="dot"></span><span id="status-t">Cargando…</span></div>
    <div class="top-actions">
      <button class="btn btn--ghost" id="undo" type="button" title="Deshacer el último cambio (Ctrl+Z)" disabled>↶ Deshacer</button>
      <button class="btn btn--ghost" id="discard" type="button" disabled>Descartar cambios</button>
      <button class="btn" id="preview-btn" type="button">Vista previa</button>
      <button class="btn btn--fill" id="publish" type="button" disabled>Publicar</button>
    </div>
  </header>

  <div class="notice" id="notice" hidden></div>

  <div class="work">
    <main class="editor" id="editor" aria-label="Editor del menú"></main>

    <aside class="pane" id="pane" aria-label="Vista previa del menú">
      <div class="pane-head">
        <span class="pane-title">Así se ve en el celular</span>
        <a class="btn btn--ghost btn--sm" id="open-preview" href="./?preview=1" target="_blank" rel="noopener">Abrir en pestaña ↗</a>
        <button class="btn btn--ghost btn--sm pane-close" id="pane-close" type="button">Cerrar</button>
      </div>
      <div class="phone"><iframe id="pv" title="Vista previa del menú" src="about:blank"></iframe></div>
      <p class="muted small pane-hint">Toca un producto o una sección en la vista previa para ir a editarla.</p>
    </aside>
  </div>

  <footer class="foot">
    <details class="adv">
      <summary>Herramientas avanzadas</summary>
      <div class="adv-body">
        <button class="btn btn--ghost btn--sm" id="backup" type="button">Descargar respaldo del menú</button>
        <button class="btn btn--ghost btn--sm" id="restore" type="button">Cargar un respaldo</button>
        <button class="btn btn--ghost btn--sm" id="reset" type="button">Volver al menú original</button>
        <button class="btn btn--ghost btn--sm" id="logout" type="button">Cerrar sesión</button>
      </div>
    </details>
    <p class="muted small" id="foot-info"></p>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="file-json" accept="application/json,.json" hidden>

<script src="js/wordmark.js"></script>
<script src="js/seasons.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
